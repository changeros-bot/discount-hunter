name: Patch budget completion state

on:
  push:
    paths:
      - '.github/workflows/patch-budget-completion.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch Financial OS budget semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pages/financial-os.js')
          s = p.read_text()

          s = s.replace(
            "const rows = (b) => b.mode === 'living_cycle' ? living.lifeRows : b.mode === 'investment' ? month.investmentRows : txs.filter((t) => t.type === '支出' && t.budgetId === b.id);",
            "const rows = (b) => b.mode === 'living_cycle' ? living.lifeRows : b.mode === 'investment' ? month.investmentRows : txs.filter((t) => t.type === '支出' && t.budgetId === b.id);\n  const isCompleted = (b) => b.mode === 'project_completed';"
          )

          s = s.replace(
            "if (aSystem !== bSystem) return aSystem ? 1 : -1;\n    return String(b.id).localeCompare(String(a.id));",
            "if (aSystem !== bSystem) return aSystem ? 1 : -1;\n    const aDone = isCompleted(a);\n    const bDone = isCompleted(b);\n    if (aDone !== bDone) return aDone ? 1 : -1;\n    return String(b.id).localeCompare(String(a.id));"
          )

          s = s.replace("setMsg(`已完成更新：${row.name}`);", "setMsg(`已儲存修改：${row.name}`);")

          anchor = "  async function remove(b) {"
          insert = """  async function setTaskCompleted(b, completed) {
    if (!String(b.mode || '').startsWith('project')) return;
    const row = { ...b, mode: completed ? 'project_completed' : 'project' };
    setSaving(true);
    try {
      await apiWrite('budget', 'upsert', row);
      setBudgets(budgets.map((x) => x.id === b.id ? row : x));
      setEditingId('');
      setMsg(completed ? `任務已完成：${b.name}` : `已重新開啟：${b.name}`);
      await onSynced();
    } catch (e) {
      setMsg((completed ? '標記完成失敗：' : '重新開啟失敗：') + e.message);
    } finally {
      setSaving(false);
    }
  }

"""
          if insert not in s:
              s = s.replace(anchor, insert + anchor)

          s = s.replace(
            "const period = b.mode === 'project' ? '專案累計' : b.mode === 'investment' ? '本月' : `${cycle.start.slice(5)}～${cycle.end.slice(5)}`;",
            "const period = isCompleted(b) ? '已完成' : b.mode === 'project' ? '專案累計' : b.mode === 'investment' ? '本月' : `${cycle.start.slice(5)}～${cycle.end.slice(5)}`;"
          )

          s = s.replace(
            "{saving ? '同步中' : '完成'}</Btn>",
            "{saving ? '同步中' : '儲存修改'}</Btn>"
          )

          old = """<button onClick={() => startEdit(b)} style={{ border: '1px solid rgba(212,175,55,.58)', background: 'rgba(92,64,16,.35)', color: '#fff7bd', borderRadius: 12, padding: '9px 12px', fontWeight: 900 }}>編輯</button></div><Metric"""
          new = """<div style={{ display: 'flex', gap: 7, alignItems: 'center' }}>{String(b.mode || '').startsWith('project') && <button onClick={() => setTaskCompleted(b, !isCompleted(b))} disabled={saving} style={{ border: isCompleted(b) ? '1px solid rgba(56,189,248,.45)' : '1px solid rgba(34,197,94,.48)', background: isCompleted(b) ? 'rgba(14,116,144,.18)' : 'rgba(20,83,45,.24)', color: isCompleted(b) ? '#7dd3fc' : '#86efac', borderRadius: 12, padding: '9px 10px', fontWeight: 900 }}>{isCompleted(b) ? '重新開啟' : '標記完成'}</button>}<button onClick={() => startEdit(b)} style={{ border: '1px solid rgba(212,175,55,.58)', background: 'rgba(92,64,16,.35)', color: '#fff7bd', borderRadius: 12, padding: '9px 12px', fontWeight: 900 }}>編輯</button></div></div><Metric"""
          if old not in s:
              raise SystemExit('Could not find budget edit button anchor')
          s = s.replace(old, new)

          s = s.replace('多元記帳本 V5.7｜Neon 主讀寫｜Local 備援', '多元記帳本 V5.8｜Neon 主讀寫｜Local 備援')

          p.write_text(s)
          PY

      - name: Commit patch
        run: |
          git config user.name "changeros-bot"
          git config user.email "chang.eros@gmail.com"
          git add pages/financial-os.js
          git commit -m "fix(financial-os): separate save changes from budget task completion"
          git push
