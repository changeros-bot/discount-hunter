name: Patch budget completion and details

on:
  push:
    paths:
      - '.github/workflows/patch-budget-completion.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch Financial OS budget UX
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pages/financial-os.js')
          s = p.read_text()

          # State for expanded budget detail cards.
          if "const [expandedBudgetIds, setExpandedBudgetIds]" not in s:
              s = s.replace(
                  "const [saving, setSaving] = useState(false);\n  const cycle = livingCycle();",
                  "const [saving, setSaving] = useState(false);\n  const [expandedBudgetIds, setExpandedBudgetIds] = useState({});\n  const cycle = livingCycle();"
              )

          if "const isCompleted = (b) => b.mode === 'project_completed';" not in s:
              s = s.replace(
                  "const rows = (b) => b.mode === 'living_cycle' ? living.lifeRows : b.mode === 'investment' ? month.investmentRows : txs.filter((t) => t.type === '支出' && t.budgetId === b.id);",
                  "const rows = (b) => b.mode === 'living_cycle' ? living.lifeRows : b.mode === 'investment' ? month.investmentRows : txs.filter((t) => t.type === '支出' && t.budgetId === b.id);\n  const isCompleted = (b) => b.mode === 'project_completed';\n  const isExpanded = (b) => Boolean(expandedBudgetIds[b.id]);\n  const toggleDetails = (b) => setExpandedBudgetIds((current) => ({ ...current, [b.id]: !current[b.id] }));"
              )

          if "const aDone = isCompleted(a);" not in s:
              s = s.replace(
                  "if (aSystem !== bSystem) return aSystem ? 1 : -1;\n    return String(b.id).localeCompare(String(a.id));",
                  "if (aSystem !== bSystem) return aSystem ? 1 : -1;\n    const aDone = isCompleted(a);\n    const bDone = isCompleted(b);\n    if (aDone !== bDone) return aDone ? 1 : -1;\n    return String(b.id).localeCompare(String(a.id));"
              )

          s = s.replace("setMsg(`已完成更新：${row.name}`);", "setMsg(`已儲存修改：${row.name}`);")
          s = s.replace("{saving ? '同步中' : '完成'}</Btn>", "{saving ? '同步中' : '儲存修改'}</Btn>")

          if "async function setTaskCompleted" not in s:
              anchor = "  async function remove(b) {"
              insert = """  async function setTaskCompleted(b, completed) {
    if (!String(b.mode || '').startsWith('project')) return;
    const row = { ...b, mode: completed ? 'project_completed' : 'project' };
    setSaving(true);
    try {
      await apiWrite('budget', 'upsert', row);
      setBudgets(budgets.map((x) => x.id === b.id ? row : x));
      setEditingId('');
      setMsg(completed ? `任務已完成：${b.name}` : `已重新開啟：${b.name}`);
      await onSynced();
    } catch (e) {
      setMsg((completed ? '標記完成失敗：' : '重新開啟失敗：') + e.message);
    } finally {
      setSaving(false);
    }
  }

"""
              s = s.replace(anchor, insert + anchor)

          s = s.replace(
              "const period = b.mode === 'project' ? '專案累計' : b.mode === 'investment' ? '本月' : `${cycle.start.slice(5)}～${cycle.end.slice(5)}`;",
              "const period = isCompleted(b) ? '已完成' : b.mode === 'project' ? '專案累計' : b.mode === 'investment' ? '本月' : `${cycle.start.slice(5)}～${cycle.end.slice(5)}`;"
          )

          old_header = """<button onClick={() => startEdit(b)} style={{ border: '1px solid rgba(212,175,55,.58)', background: 'rgba(92,64,16,.35)', color: '#fff7bd', borderRadius: 12, padding: '9px 12px', fontWeight: 900 }}>編輯</button></div><Metric"""
          new_header = """<div style={{ display: 'flex', gap: 7, alignItems: 'center', flexWrap: 'wrap', justifyContent: 'flex-end' }}>{String(b.mode || '').startsWith('project') && <button onClick={() => setTaskCompleted(b, !isCompleted(b))} disabled={saving} style={{ border: isCompleted(b) ? '1px solid rgba(56,189,248,.45)' : '1px solid rgba(34,197,94,.48)', background: isCompleted(b) ? 'rgba(14,116,144,.18)' : 'rgba(20,83,45,.24)', color: isCompleted(b) ? '#7dd3fc' : '#86efac', borderRadius: 12, padding: '9px 10px', fontWeight: 900 }}>{isCompleted(b) ? '重新開啟' : '標記完成'}</button>}<button onClick={() => startEdit(b)} style={{ border: '1px solid rgba(212,175,55,.58)', background: 'rgba(92,64,16,.35)', color: '#fff7bd', borderRadius: 12, padding: '9px 12px', fontWeight: 900 }}>編輯</button></div></div><Metric"""
          if old_header in s:
              s = s.replace(old_header, new_header)

          old_details = """{rows(b).length > 0 && <TxList rows={rows(b)} budgets={budgets} />}"""
          new_details = """{rows(b).length > 0 && <><button onClick={() => toggleDetails(b)} style={{ width: '100%', marginTop: 10, border: '1px solid rgba(56,189,248,.32)', background: 'rgba(14,116,144,.12)', color: '#7dd3fc', borderRadius: 12, padding: '10px', fontWeight: 900 }}>{isExpanded(b) ? '收合明細' : `查看明細（${rows(b).length} 筆）`}</button>{isExpanded(b) && <TxList rows={rows(b)} budgets={budgets} />}</>}"""
          s = s.replace(old_details, new_details)

          s = s.replace('多元記帳本 V5.7｜Neon 主讀寫｜Local 備援', '多元記帳本 V5.8｜Neon 主讀寫｜Local 備援')
          p.write_text(s)
          PY

      - name: Commit patch
        run: |
          git config user.name "changeros-bot"
          git config user.email "chang.eros@gmail.com"
          git add pages/financial-os.js
          if git diff --cached --quiet; then
            echo "Patch already applied"
            exit 0
          fi
          git commit -m "fix(financial-os): add collapsible budget details and completion state"
          git push
