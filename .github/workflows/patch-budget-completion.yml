name: Separate active and archived budgets

on:
  push:
    paths:
      - 'budget-separation-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Separate budget sections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pages/financial-os.js')
          s = p.read_text()

          old = """  const orderedBudgets = [...budgets].sort((a, b) => {
    const aSystem = ['b-living', 'b-invest'].includes(a.id);
    const bSystem = ['b-living', 'b-invest'].includes(b.id);
    if (aSystem !== bSystem) return aSystem ? 1 : -1;
    const aArchived = isArchived(a);
    const bArchived = isArchived(b);
    if (aArchived !== bArchived) return aArchived ? 1 : -1;
    return String(b.id).localeCompare(String(a.id));
  });"""
          new = """  const sortBudgetRows = (items) => [...items].sort((a, b) => {
    const aSystem = ['b-living', 'b-invest'].includes(a.id);
    const bSystem = ['b-living', 'b-invest'].includes(b.id);
    if (aSystem !== bSystem) return aSystem ? 1 : -1;
    return String(b.id).localeCompare(String(a.id));
  });
  const activeBudgets = sortBudgetRows(budgets.filter((b) => !isArchived(b)));
  const archivedBudgets = sortBudgetRows(budgets.filter(isArchived));"""
          if old not in s:
              raise SystemExit('sorting anchor not found')
          s = s.replace(old, new)

          s = s.replace(
              """    {orderedBudgets.map((b) => {""",
              """    <Title t=\"進行中預算\" r={`${activeBudgets.length} 項`} />
    {activeBudgets.map((b) => {""",
              1
          )

          anchor = """    <Card style={{ borderColor: 'rgba(56,189,248,.42)' }}><Title t=\"所有預算總計\""""
          archived = """    {archivedBudgets.length > 0 && <>
      <div style={{ margin: '22px 0 10px', paddingTop: 14, borderTop: '1px solid rgba(125,211,252,.28)' }}><Title t=\"已結案預算\" r={`${archivedBudgets.length} 項｜封存`} /></div>
      {archivedBudgets.map((b) => {
        const bRows = rows(b);
        const bUsed = used(b);
        const remaining = Number(b.amount || 0) - bUsed;
        const period = '已封存';
        if (editingId === b.id) return <Card key={b.id}><Title t=\"編輯預算\" r={period} /><div style={{ display: 'grid', gap: 9 }}><input value={editForm.name} onChange={(e) => setEditForm({ ...editForm, name: e.target.value })} style={input()} /><select value={editForm.category} onChange={(e) => setEditForm({ ...editForm, category: e.target.value })} style={input()}>{cats.map((x) => <option key={x}>{x}</option>)}</select><input value={editForm.amount} onChange={(e) => setEditForm({ ...editForm, amount: e.target.value })} style={input()} inputMode=\"numeric\" /><div style={{ color: '#94a3b8', fontSize: 12 }}>目前已使用 {nt(bUsed)}｜修改預算不會改動交易明細</div><div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 8 }}><Btn onClick={() => saveEdit(b)} disabled={saving}>{saving ? '同步中' : '儲存修改'}</Btn><button onClick={() => setEditingId('')} style={{ border: '1px solid rgba(148,163,184,.38)', background: 'rgba(15,23,42,.7)', color: '#cbd5e1', borderRadius: 12, fontWeight: 900 }}>取消</button><button onClick={() => remove(b)} disabled={saving} style={{ border: '1px solid rgba(248,113,113,.45)', background: 'rgba(127,29,29,.18)', color: '#fca5a5', borderRadius: 12, fontWeight: 900 }}>刪除</button></div></div></Card>;
        return <Card key={b.id} style={{ opacity: .78, borderColor: 'rgba(125,211,252,.28)' }}><div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 10, marginBottom: 12 }}><div><h2 style={{ margin: 0, fontSize: 18, fontWeight: 950 }}>{b.name}</h2><div style={{ color: '#7dd3fc', fontSize: 12, fontWeight: 900, marginTop: 4 }}>{period}</div></div><div style={{ display: 'flex', gap: 7, flexWrap: 'wrap', justifyContent: 'flex-end' }}><button onClick={() => setBudgetArchived(b, false)} disabled={saving} style={{ border: '1px solid rgba(56,189,248,.45)', background: 'rgba(14,116,144,.18)', color: '#7dd3fc', borderRadius: 12, padding: '9px 10px', fontWeight: 900 }}>重新開啟</button><button onClick={() => startEdit(b)} style={{ border: '1px solid rgba(212,175,55,.58)', background: 'rgba(92,64,16,.35)', color: '#fff7bd', borderRadius: 12, padding: '9px 12px', fontWeight: 900 }}>編輯</button></div></div><Metric label={b.category} value={nt(bUsed)} sub={`預算 ${nt(b.amount)}｜${remaining < 0 ? `超支 ${nt(Math.abs(remaining))}` : `剩餘 ${nt(remaining)}`}`} bad={remaining < 0} />{bRows.length > 0 && <><button onClick={() => toggleDetails(b)} style={{ width: '100%', marginTop: 10, border: '1px solid rgba(56,189,248,.32)', background: 'rgba(14,116,144,.12)', color: '#7dd3fc', borderRadius: 12, padding: '10px', fontWeight: 900 }}>{isExpanded(b) ? '收合明細' : `查看明細（${bRows.length} 筆）`}</button>{isExpanded(b) && <TxList rows={bRows} budgets={budgets} />}</>}</Card>;
      })}
    </>}
"""
          if anchor not in s:
              raise SystemExit('total anchor not found')
          s = s.replace(anchor, archived + anchor, 1)
          s = s.replace('多元記帳本 V5.8｜Neon 主讀寫｜Local 備援', '多元記帳本 V5.9｜Neon 主讀寫｜Local 備援')
          p.write_text(s)
          PY

      - name: Commit patch
        run: |
          git config user.name "changeros-bot"
          git config user.email "chang.eros@gmail.com"
          git add pages/financial-os.js
          git commit -m "fix(financial-os): separate active and archived budgets"
          git push
